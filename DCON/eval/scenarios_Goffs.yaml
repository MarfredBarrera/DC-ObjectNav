# Per-scene ObjectNav evaluation for eval_scene.py (run / review / report).
#
# One scene, swept over a cross product of target objects x agent start
# positions. Run id = "{target}__{start_name}" (+ "__r{k}" when repeated).
#
#   python eval_scene.py run    --scenarios eval/scenarios_Goffs.yaml --out output/goffs
#   python eval_scene.py review --scenarios eval/scenarios_Goffs.yaml --out output/goffs
#   # ...inspect output/goffs/ep/<id>/ (video + bev_final.png) and edit
#   #    output/goffs/verdicts.yaml (status: auto/success/fail/exclude per run)...
#   python eval_scene.py report --scenarios eval/scenarios_Goffs.yaml --out output/goffs
#
# TODO: the start/goal coordinates below are PLACEHOLDERS — replace with real
# positions measured in the scene (read agent/object xyz from a manual run or
# the habitat viewer).

scene: gibson_scenes/Goffs.glb
success_radius_m: 1.0

# Number of (stochastic) runs per (target, start) combo. >1 gives a variance
# estimate; each repeat is an independent episode (MPPI noise is unseeded). With
# >1 the run id gets a `__r{k}` suffix (e.g. chair__hallway__r0). Default 1.
runs_per_combo: 3

# Object detector backend for every run. Overridden by the CLI --detector flag;
# omit this line to fall back to the config default. One of:
#   yolo / coco_yolo / hybrid / grounding_dino / locate_anything / llmdet
detector: llmdet

# Named agent spawn points (world xyz, snapped to the navmesh on spawn).
# Naming them keeps run ids and exclusions human-readable. A bare list also
# works (auto-named start0, start1, ...).
starts:
  office:      [0.0, -3.0, 0.0]
  hallway:     [-2.0, -3.0, 6.0]
  kitchen:     [0.0, -3.0, -9.0]
  living_room: [-8.0, -3.0, -6.0]
  bathroom:    [-1.0, -3.0, 2.2]

# Each target: the CLIP query string + every known instance of the object. A
# self-stop near ANY instance counts; the NEAREST drives the geodesic for SPL.
# A goal is either:
#   - a POINT:     [x, y, z]
#   - a RECTANGLE: {rect: [x_min, z_min, x_max, z_max], y: <height>}  — for large
#       furniture (e.g. a table); the agent may stop anywhere along the footprint
#       and is scored against the closest part of it.
# Optional per-target `success_radius_m` widens the stop tolerance for that
# target (else the global success_radius_m applies).
targets:
  coffee_maker:
    query: "coffee maker"
    goals:
      - [0.5, -3.0, -4.5]
  chair:
    query: "chair"
    goals:
      - [-5.0, -3.0, -7.0]
      - [-0.8, -3.0, -1.65]
      # - [-3.3, -3.0, 5.4]
      - {rect: [-3.75, 4.5, -3.25, 6.0], y: -3.0}
      - {rect: [-8.0, -2.0, -5.75, -0.5], y: -3.0}
      - {rect: [-3.0, -7.0, -2.0, -4.0], y: -3.0}
      - {rect: [-2.5, -9.5, -0.9, -8.5], y: -3.0}


  refrigerator:
    query: "silver refrigerator"
    goals:
      - {rect: [-1.5, -3.75, -0.5, -3.5], y: -3.0}


  coat:
    query: "coat"
    goals:
      - [-3.5, -3.0, 4.5]
      - [-3.5, -3.0, 5.5]
      - [-0.75, -3.5, 5.0]

  basketball_hoop:
    query: "mini basketball hoop"
    goals:
      - [-4.10, -3.0, 0.75]

  fume_hood:
    query: "kitchen fume hood"
    goals:
      - [0.5, -3.0, -6.0]

  toilet:
    query: "toilet"
    goals:
      - [0.0, -3.0, 3.0]




# # OPTIONAL: restrict to specific (target, start) combos. Omit this whole block
# # to run the full cross product (every target from every start).
# combos:
  # - {target: chair,  start: office}
  # - {target: chair, start: living_room}
  # - {target: chair, start: bathroom}
  # - {target: chair, start: kitchen}
  # - {target: chair, start: hallway}
