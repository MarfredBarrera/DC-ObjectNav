# Calibration sweep for the contrastive CLIPSeg field-verify threshold.
# Caps Gibson (5 categories x 5 scenes) at 2 episodes/combo = 50 episodes,
# comparable scale to the LLMDet 60-frame tau sweep. Pair with
# --agent_config config/agent_configs/detector_distractors_field_calib.yaml:
#
#   python benchmarks/eval_scene.py run --benchmark gibson \
#       --agent_config config/agent_configs/detector_distractors_field_calib.yaml \
#       --experiment fieldverify_contrastive_calib --gpu 3
#
# Then: python tools/calibrate_field_verify.py --out output/<out dir>
max_per_combo: 2
