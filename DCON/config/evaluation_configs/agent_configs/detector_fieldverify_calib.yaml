# Field-verified LLMDet detector — CALIBRATION overlay (gate log-only).
#
# τ=0.47 sink-gated LLMDet, no LocateAnything cascade. field_verify is ON but
# the threshold is 0.0, so every fired box passes and the pooled field score
# is only *logged* (traj_log.jsonl `field_score`) — behaviorally this is the
# plain τ=0.47 LLMDet detector, and doubles as the no-gate reference for the
# threshold sweep. Overlay on config/config.yaml via eval_scene.py
# `run --agent-config <this file>`.
detection:
  llmdet_threshold: 0.47
  detector_cascade: false
  field_verify: true
  field_verify_threshold: 0.0
  field_verify_top_frac: 0.10
