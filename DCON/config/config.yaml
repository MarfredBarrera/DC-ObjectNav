# DCON Configuration File

# Paths
paths:
  output_dir: "/workspace/DCON/output/current_scene"
  output_name: "model.pt"

habitat:
  scene_path: "/workspace/DCON/gibson_scenes/Annawan.glb"
  img_width: 512
  img_height: 512
  fov: 90
  sensor_height: 1.0
  data_queue_size: 30
  training_queue_size: 20

# Semantics Settings (MaskCLIP)
semantics:
  maskclip_model_name: "ViT-B/16"
  maskclip_input_size: 448
  target_query: "a pillow"

# Training Settings
training:
  iterations: 60000
  device: "cuda"
  gpu_indices: "6"
  near_plane: 0.01

# Hyperparameters
hyperparameters:
  ssim_weight: 0.2
  l1_weight: 0.8
  scale_reg: 0.01
  uncertainty_weight: 0.1
  uncertainty_dim: 16

# Learning Rates
learning_rates:
  means: 0.00016
  scales: 0.005
  quats: 0.001
  opacities: 0.05
  sh0: 0.0025
  shN: 0.000125
  uncertainty: 0.001

# Strategy Settings
strategy:
  refine_start_iter: 100
  refine_stop_iter: 9500
  refine_every: 100
  reset_every: 1000
  grow_grad2d: 0.0002
  prune_opa: 0.005

# Toggles
toggles:
  train_uncertainty: true

# HashGrid Configuration
hashgrid:
  # Grid Structure
  n_levels: 16
  n_features_per_level: 2
  log2_hashmap_size: 19
  base_resolution: 16
  per_level_scale: 1.5
  
  # MLP Architecture
  n_neurons: 128
  n_hidden_layers: 3
  feature_dim: 512
  
  # Training
  lr: 0.001
  per_image_batch_size: 518400
  train_batch_size: 8192
  inference_batch_size: 16384
  replay_buffer_size: 10
  buffer_refresh_interval: 2000
  train_every_n_steps: 1
  warmup_steps: 0

ensemble:
  num_models: 3
 
grid:
  voxel_resolution: 0.10
  max_height: 2.0

planning:
  mppi_dt: 0.1
  mppi_w_sign: -1.0