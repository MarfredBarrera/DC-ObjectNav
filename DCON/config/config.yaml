# DCON Configuration File

# Paths
paths:
  output_dir: "/workspace/DCON/output/current_scene"

habitat:
  scene_path: "/workspace/DCON/gibson_scenes/Goffs.glb"
  img_width: 512
  img_height: 512
  fov: 90
  sensor_height: 1.0
  # Navmesh agent radius (m): walls are inset by this much, so smaller =
  # agent squeezes through narrower gaps. Recomputed on load (the prebaked
  # Gibson navmesh is baked at 0.1). <=0 keeps the prebaked navmesh.
  agent_radius: 0.02
  agent_height: 1.5

# Semantics Settings (MaskCLIP)
semantics:
  maskclip_model_name: "ViT-B/16"
  maskclip_input_size: 448
  target_query: "a pillow"

# Training Settings
training:
  iterations: 100000
  device: "cuda"

# HashGrid Configuration
hashgrid:
  # Grid Structure
  n_levels: 16
  n_features_per_level: 2
  log2_hashmap_size: 19
  base_resolution: 16
  per_level_scale: 1.5

  # MLP Architecture
  n_neurons: 128
  n_hidden_layers: 3
  # Scalar CLIPSeg relevance score, not a MaskCLIP embedding.
  feature_dim: 1

  # Training
  lr: 0.001
  train_batch_size: 8192
  inference_batch_size: 16384
  buffer_refresh_interval: 500

grid:
  voxel_resolution: 0.10
  max_height: 2.0
  # Height band (world-Y meters, absolute) collapsed into every 2D BEV map
  # (similarity, occupancy, epistemic). min MUST sit ~0.2 m ABOVE the
  # floor surface: occupancy marks the floor plane itself occupied, and at
  # voxel_resolution the surface bleeds up ~one voxel row, so a min flush with
  # the floor turns the whole walkable area into "obstacle". For a multi-floor
  # scene, set the band to the target floor (floor+0.2 .. floor+1.5) so upper
  # floors don't bleed in (raise max_height if the band exceeds it).
  # bev_height_min: 0.2     # y=0 floor: 0.2 m above the surface
  # bev_height_max: 1.5

  # Bottom floor (same rule: min must be ~0.2 m above that floor's surface,
  # or the floor plane bleeds in and the whole level reads as obstacle):
  bev_height_min: -2.8
  bev_height_max: -1.4
  # Zero uncertainty at observed-free voxels (kills phantom epistemic
  # traces over traversed empty rooms; field never trains on air).
  mask_free_epistemic: true

planning:
  mppi_dt: 0.1
  mppi_w_sign: -1.0
  # Intermediate collision checks per rollout segment (prevents tunneling
  # through thin walls between waypoints). 0 = waypoints only.
  mppi_collision_substeps: 4

  # Continuous→discrete action transformation. Set discrete_actions: true to
  # execute Habitat ObjectNav primitives (MOVE_FORWARD / TURN_LEFT / TURN_RIGHT /
  # STOP) via a tracking controller over the MPPI plan, for apples-to-apples
  # SR/SPL comparison with VLFM and Goal-Oriented Semantic Exploration.
  discrete_actions: false
  discrete_forward_m: 0.25       # MOVE_FORWARD displacement (challenge default)
  discrete_turn_deg: 30.0        # TURN_LEFT/RIGHT magnitude (challenge default)
  discrete_lookahead_m: 0.5      # pure-pursuit lookahead along the MPPI path
  max_agent_steps: 500           # per-episode primitive budget (timeout = failure)

detection:
  detected_persistence: 1       # consecutive usable-band detections to latch
  stop_distance_m: 0.5          # terminate within this distance of sim peak
  llmdet_threshold: 0.47         # LLMDet per-box score floor (tau); ~99% background-FP rejection w/ sinks

  # Two-stage detection: LocateAnything-3B proposes, LLMDet (sink-gated) verifies.
  # A frame counts only when both fire on the same region (IoU >= cascade_min_iou),
  # cutting geometric-look-alike false positives at ~2x SEARCH detector latency.
  detector_cascade: true
  cascade_min_iou: 0.1
