# DCON Configuration File

# Paths
paths:
  output_dir: "/workspace/DCON/output/current_scene"

habitat:
  scene_path: "/workspace/DCON/benchmarks/gibson_scenes/Goffs.glb"
  img_width: 512
  img_height: 512
  fov: 90
  # Habitat's PointNav default camera POSITION is [0, 1.25, 0] (DD-PPO's
  # training height); matched since EXPLOIT's DD-PPO policy consumes this
  # depth sensor directly.
  sensor_height: 1.25
  # Navmesh agent radius (m): walls are inset by this much, so smaller =
  # agent squeezes through narrower gaps. Recomputed on load (the prebaked
  # Gibson navmesh is baked at 0.1). <=0 keeps the prebaked navmesh.
  # 0.02 (not DD-PPO's training-time 0.1) to route around Gibson-specific
  # navmesh/mesh-hole narrow-gap issues — the DD-PPO turn-only stall this
  # was widened to test for turned out to be the turn-sign bug in
  # SimInterface.step_discrete, not a collision-radius mismatch; 0.1 was
  # left in afterward and is suspected of sealing a doorway needed to
  # reach the goal in tv__Collierville__ep25.
  agent_radius: 0.02
  agent_height: 1.5

# Semantics Settings
semantics:
  target_query: "a pillow"

# Training Settings
training:
  iterations: 100000
  device: "cuda"
  # Master RNG seed (torch/numpy/random + the feature field init).
  # Fixed so an episode is reproducible and A/B differences are
  # attributable to the change under test, not run-to-run drift.
  seed: 0

# HashGrid Configuration
hashgrid:
  # Grid Structure
  n_levels: 16
  n_features_per_level: 2
  log2_hashmap_size: 19
  base_resolution: 16
  per_level_scale: 1.5

  # MLP Architecture
  n_neurons: 128
  n_hidden_layers: 3
  # NOTE: the field's output width is NOT configured here — PerceptionStack
  # derives hash_feature_dim as 1 + len(distractors) (one sigmoid channel per
  # CLIPSeg prompt) once filter_distractors has run against this run's query.

  # Training
  lr: 0.001
  train_batch_size: 8192
  inference_batch_size: 16384
  buffer_refresh_interval: 500

grid:
  voxel_resolution: 0.10
  max_height: 2.0
  # Height band (world-Y meters, absolute) collapsed into every 2D BEV map
  # (similarity, occupancy, epistemic). min MUST sit ~0.2 m ABOVE the
  # floor surface: occupancy marks the floor plane itself occupied, and at
  # voxel_resolution the surface bleeds up ~one voxel row, so a min flush with
  # the floor turns the whole walkable area into "obstacle". For a multi-floor
  # scene, set the band to the target floor (floor+0.2 .. floor+1.5) so upper
  # floors don't bleed in (raise max_height if the band exceeds it).
  # bev_height_min: 0.2     # y=0 floor: 0.2 m above the surface
  # bev_height_max: 1.5

  # Bottom floor (same rule: min must be ~0.2 m above that floor's surface,
  # or the floor plane bleeds in and the whole level reads as obstacle):
  bev_height_min: -2.8
  bev_height_max: -1.4
  # Zero uncertainty at observed-free voxels (kills phantom epistemic
  # traces over traversed empty rooms; field never trains on air).
  mask_free_epistemic: true

planning:
  mppi_dt: 0.1
  mppi_w_sign: -1.0
  # Intermediate collision checks per rollout segment (prevents tunneling
  # through thin walls between waypoints). 0 = waypoints only.
  mppi_collision_substeps: 4

  # Continuous→discrete action transformation. Set discrete_actions: true to
  # execute Habitat ObjectNav primitives (MOVE_FORWARD / TURN_LEFT / TURN_RIGHT /
  # STOP) via a tracking controller over the MPPI plan, for apples-to-apples
  # SR/SPL comparison with VLFM and Goal-Oriented Semantic Exploration.
  discrete_actions: false
  discrete_forward_m: 0.25       # MOVE_FORWARD displacement (challenge default)
  # TURN_LEFT/RIGHT magnitude for the SEARCH tracking controller (challenge
  # convention). DD-PPO's EXPLOIT stepping does NOT read this — it uses its
  # own checkpoint-coupled 10 deg (DDPPO_TURN_DEG in ddppo_policy.py; the
  # policy was trained at Habitat PointNav's TURN_ANGLE=10 and a 30 deg step
  # caused ~3x turn overshoot every action).
  discrete_turn_deg: 30.0

  discrete_lookahead_m: 0.5      # pure-pursuit lookahead along the MPPI path
  max_agent_steps: 500           # unused: no per-episode primitive timeout is enforced

detection:
  detected_persistence: 1       # consecutive usable-band detections to latch
  stop_distance_m: 0.75          # terminate within this distance of sim peak
  llmdet_threshold: 0.47         # LLMDet per-box score floor (tau); ~99% background-FP rejection w/ sinks

  # Canonical verification arm (= detector_pairwise_field_maxj): the pairwise
  # CLIPSeg field gates each sink-gated LLMDet box by the worst-case margin
  # (query presence - hardest distractor presence, pooled over the top-frac
  # in-box cells) clearing 0.0 — the tuning-free max-Youden-J point.
  clipseg_pairwise: true
  field_verify: true
  field_verify_threshold: 0.0
  field_verify_presence_floor: 0.0
  field_verify_top_frac: 0.10
