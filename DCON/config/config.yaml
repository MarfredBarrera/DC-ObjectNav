# DCON Configuration File

# Paths
paths:
  output_dir: "/workspace/DCON/output/current_scene"
  output_name: "model.pt"

habitat:
  scene_path: "/workspace/DCON/gibson_scenes/Goffs.glb"
  img_width: 512
  img_height: 512
  fov: 90
  sensor_height: 1.0
  data_queue_size: 30
  training_queue_size: 20
  # Navmesh agent radius (m): walls are inset by this much, so smaller =
  # agent squeezes through narrower gaps. Recomputed on load (the prebaked
  # Gibson navmesh is baked at 0.1). <=0 keeps the prebaked navmesh.
  agent_radius: 0.02
  agent_height: 1.5

# Semantics Settings (MaskCLIP)
semantics:
  maskclip_model_name: "ViT-B/16"
  maskclip_input_size: 448
  target_query: "a pillow"

# Training Settings
training:
  iterations: 100000
  device: "cuda"
  gpu_indices: "6"
  near_plane: 0.01

# Hyperparameters
hyperparameters:
  ssim_weight: 0.2
  l1_weight: 0.8
  scale_reg: 0.01
  uncertainty_weight: 0.1
  uncertainty_dim: 16

# Learning Rates
learning_rates:
  means: 0.00016
  scales: 0.005
  quats: 0.001
  opacities: 0.05
  sh0: 0.0025
  shN: 0.000125
  uncertainty: 0.001

# Strategy Settings
strategy:
  refine_start_iter: 100
  refine_stop_iter: 9500
  refine_every: 100
  reset_every: 1000
  grow_grad2d: 0.0002
  prune_opa: 0.005

# Toggles
toggles:
  train_uncertainty: true

# HashGrid Configuration
hashgrid:
  # Grid Structure
  n_levels: 16
  n_features_per_level: 2
  log2_hashmap_size: 19
  base_resolution: 16
  per_level_scale: 1.5
  
  # MLP Architecture
  n_neurons: 128
  n_hidden_layers: 3
  feature_dim: 512
  
  # Training
  lr: 0.001
  per_image_batch_size: 518400
  train_batch_size: 8192
  inference_batch_size: 16384
  replay_buffer_size: 10
  buffer_refresh_interval: 500
  train_every_n_steps: 1
  warmup_steps: 0

ensemble:
  num_models: 3
 
grid:
  voxel_resolution: 0.10
  max_height: 2.0
  # Height band (world-Y meters, absolute) collapsed into every 2D BEV map
  # (similarity, occupancy, coverage, epistemic). min MUST sit ~0.2 m ABOVE the
  # floor surface: occupancy marks the floor plane itself occupied, and at
  # voxel_resolution the surface bleeds up ~one voxel row, so a min flush with
  # the floor turns the whole walkable area into "obstacle". For a multi-floor
  # scene, set the band to the target floor (floor+0.2 .. floor+1.5) so upper
  # floors don't bleed in (raise max_height if the band exceeds it).
  bev_height_min: 0.2     # y=0 floor: 0.2 m above the surface
  bev_height_max: 1.5

  # Bottom floor (same rule: min must be ~0.2 m above that floor's surface,
  # or the floor plane bleeds in and the whole level reads as obstacle):
  # bev_height_min: -2.8
  # bev_height_max: -1.4
  # Soft coverage: each depth update adds min(1,(ref/d)^2) per confirmed
  # voxel; IG deficit = exp(-coverage/tau). Bigger tau = slower saturation.
  coverage_ref_dist_m: 2.0
  coverage_tau: 3.0
  # Zero uncertainty at observed-free voxels (kills phantom epistemic
  # traces over traversed empty rooms; field never trains on air).
  mask_free_epistemic: true

planning:
  mppi_dt: 0.1
  mppi_w_sign: -1.0
  # Intermediate collision checks per rollout segment (prevents tunneling
  # through thin walls between waypoints). 0 = waypoints only.
  mppi_collision_substeps: 4

detection:
  detector: "hybrid"            # yolo / coco_yolo / hybrid / grounding_dino
  detected_conf_threshold: 0.4  # det_score required to latch DETECTED
  detected_persistence: 2       # consecutive replans above threshold to latch
  stop_distance_m: 0.75          # terminate within this distance of sim peak
  # Distractor vocabulary: competing YOLO-World classes + CLIP softmax
  # negatives for SAM mask scoring (bare nouns; "a " is prepended for CLIP).
  det_negative_classes: ["wall", "door", "window", "floor", "ceiling",
                         "curtain", "cabinet", "shelf", "picture", "refrigerator"]

sam:
  sam_softmax_temp: 100.0       # CLIP logit scale before the mask softmax
  sam_min_target_prob: 0.5      # min softmax prob of the target for the best mask