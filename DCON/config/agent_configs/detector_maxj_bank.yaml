# Distractor bank matched to the ORIGINAL gibson_pairwise_maxj run (2026-07-16)
# for a clean, detector-held-constant comparison of the EXPLOIT fixes.
#
# At that time `background_terms` did not exist; the entire pairwise-field
# competing-class bank was `distractor_objects`. Reproduced here as an empty
# background bank plus the exact 18-term list maxj verified against. Stack this
# AFTER detector_pairwise_field_maxj.yaml so it overrides only the bank
# (llmdet_threshold, field_verify_threshold 0.0, etc. stay canonical).
#
# NOTE: this matches the TERMS. The vocabulary-building / filtering code
# (build_distractor_vocabulary, filter_distractors) is current, not maxj-era —
# a residual difference the terms alone can't erase.
detection:
  background_terms: []
  distractor_objects:
    - "a chair"
    - "a couch"
    - "a bed"
    - "a potted plant"
    - "a toilet"
    - "a tv"
    - "a table"
    - "a cabinet"
    - "a bench"
    - "a sink"
    - "a bathtub"
    - "a window"
    - "a door"
    - "a picture"
    - "a pillow"
    - "a rug"
    - "a wall"
    - "the floor"
